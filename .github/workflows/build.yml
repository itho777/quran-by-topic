name: Build Mobile App

on:
  push:
    branches:
      - main
      - mobile
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-android:
    name: Build Android (APK + AAB)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Write local.properties (CI override)
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> android/local.properties
          echo "flutter.minSdkVersion=21" >> android/local.properties

      - name: Setup Keystore & key.properties
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode --ignore-garbage > android/app/upload-keystore.jks
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
            echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
            echo "storeFile=upload-keystore.jks" >> android/key.properties
            echo "Keystore decoded from secret."
          else
            keytool -genkey -v -keystore android/app/upload-keystore.jks -storetype JKS -keyalg RSA -keysize 2048 -validity 10000 -alias upload -dname "CN=CI, OU=CI, O=CI, L=CI, S=CI, C=US" -storepass tafseeridpass -keypass tafseeridpass
            echo "storePassword=tafseeridpass" > android/key.properties
            echo "keyPassword=tafseeridpass" >> android/key.properties
            echo "keyAlias=upload" >> android/key.properties
            echo "storeFile=upload-keystore.jks" >> android/key.properties
            echo "Generated dummy keystore for CI release build."
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: |
          flutter build apk --release --android-skip-build-dependency-validation 2>&1 | tee apk.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "::error::Build APK failed!"
            cat apk.log | tail -n 100
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tafseer-id-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Build release AAB (Google Play)
        continue-on-error: true
        run: flutter build appbundle --release --android-skip-build-dependency-validation

      - name: Upload AAB artifact (Google Play)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: tafseer-id-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  build-ios:
    name: Build iOS (.ipa / no-codesign)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Clean Extended Attributes
        run: |
          find . -type f \( -name "*.framework" -o -name "*.app" -o -name "*.dylib" \) -exec xattr -cr {} + 2>/dev/null || true

      - name: Build iOS (no code sign)
        run: flutter build ios --release --no-codesign

      - name: Archive Runner.app as zip
        run: |
          cd build/ios/iphoneos
          zip -r Runner.zip Runner.app
          echo "Archive created at build/ios/iphoneos/Runner.zip"

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: tafseer-id-release-ios
          path: build/ios/iphoneos/Runner.zip
          retention-days: 30
