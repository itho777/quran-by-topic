name: Build Mobile App

on:
  push:
    branches:
      - main
      - mobile
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-android:
    name: Build Android (APK + AAB)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure Flutter JDK
        run: flutter config --jdk-dir $JAVA_HOME

      - name: Install Android SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-36" || true

      - name: Setup Keystore & key.properties (if secret available)
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode --ignore-garbage > android/app/upload-keystore.jks
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
            echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
            echo "storeFile=upload-keystore.jks" >> android/key.properties
            echo "Release keystore configured from secrets."
          else
            echo "KEYSTORE_BASE64 secret not set — using default debug signing for release build."
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare local.properties
        run: |
          touch android/local.properties
          echo "flutter.minSdkVersion=21" >> android/local.properties

      - name: Build release APK
        id: build_apk
        run: flutter build apk --release 2>&1 | tee /tmp/flutter_build.log; exit ${PIPESTATUS[0]}

      - name: Build release AAB (App Bundle)
        id: build_aab
        run: flutter build appbundle --release 2>&1 | tee -a /tmp/flutter_build.log; exit ${PIPESTATUS[0]}

      - name: Dump build log on failure
        if: failure()
        run: |
          echo "## ❌ Flutter Build Error" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E -A3 "(error:|FAILURE|Exception|Caused by|BUILD FAILED|What went wrong|> Task|aapt2 error|Could not|linker|undefined)" /tmp/flutter_build.log | tail -120 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Last 100 lines of raw log:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -100 /tmp/flutter_build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload build log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: /tmp/flutter_build.log
          retention-days: 7

      - name: Verify APK & AAB exist
        run: |
          if [ ! -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            echo "ERROR: APK not found at build/app/outputs/flutter-apk/app-release.apk"
            exit 1
          fi
          if [ ! -f "build/app/outputs/bundle/release/app-release.aab" ]; then
            echo "ERROR: AAB not found at build/app/outputs/bundle/release/app-release.aab"
            exit 1
          fi
          echo "APK found: $(du -sh build/app/outputs/flutter-apk/app-release.apk)"
          echo "AAB found: $(du -sh build/app/outputs/bundle/release/app-release.aab)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tafseer-id-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: tafseer-id-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  build-ios:
    name: Build iOS (.ipa / no-codesign)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Clean Extended Attributes
        run: |
          find . -type f \( -name "*.framework" -o -name "*.app" -o -name "*.dylib" \) -exec xattr -cr {} + 2>/dev/null || true

      - name: Build iOS (no code sign)
        run: flutter build ios --release --no-codesign

      - name: Archive Runner.app as zip
        run: |
          cd build/ios/iphoneos
          zip -r Runner.zip Runner.app
          echo "Archive created at build/ios/iphoneos/Runner.zip"

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: tafseer-id-release-ios
          path: build/ios/iphoneos/Runner.zip
          retention-days: 30
