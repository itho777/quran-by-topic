name: Build Mobile App

on:
  push:
    branches:
      - main
      - mobile
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  bump-version:
    name: Bump versionCode
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-bump versionCode in pubspec.yaml
        id: bump
        run: |
          CURRENT=$(grep '^version:' pubspec.yaml | head -1)
          NAME=$(echo "$CURRENT" | sed 's/version: //' | cut -d'+' -f1)
          CODE=$(echo "$CURRENT" | cut -d'+' -f2)
          NEW_CODE=$((CODE + 1))
          NEW_VERSION="${NAME}+${NEW_CODE}"
          echo "Bumping from ${CODE} to ${NEW_CODE} → ${NEW_VERSION}"
          sed -i "s/^version: .*/version: ${NEW_VERSION}/" pubspec.yaml
          echo "new_version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Commit & push bumped version
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "ci: auto-bump versionCode to ${{ steps.bump.outputs.new_version }}" || echo "Nothing to commit"
          git push

  build-android:
    name: Build Android (APK + AAB)
    runs-on: ubuntu-latest
    needs: bump-version
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Write local.properties (CI override)
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT"  >> android/local.properties

      - name: Decode upload keystore from secret
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode --ignore-garbage > android/app/upload-keystore.jks
            echo "Keystore decoded from secret."
          else
            echo "KEYSTORE_BASE64 secret not set — will use debug signing."
          fi

      - name: Create key.properties (CI release signing)
        run: |
          if [ -f "android/app/upload-keystore.jks" ]; then
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD || 'tafseeridpass' }}" > android/key.properties
            echo "keyPassword=${{ secrets.KEY_PASSWORD || 'tafseeridpass' }}" >> android/key.properties
            echo "keyAlias=${{ secrets.KEY_ALIAS || 'upload' }}" >> android/key.properties
            echo "storeFile=upload-keystore.jks" >> android/key.properties
          else
            echo "No keystore found — skipping key.properties."
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release AAB (Google Play)
        run: flutter build appbundle --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tafseer-id-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload AAB artifact (Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: tafseer-id-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  build-ios:
    name: Build iOS (.ipa / no-codesign)
    runs-on: macos-latest
    needs: bump-version
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update
        env:
          LANG: en_US.UTF-8

      - name: Build iOS (no code sign)
        run: flutter build ios --release --no-codesign

      - name: Archive Runner.app as zip
        run: |
          cd build/ios/iphoneos
          zip -r Runner.zip Runner.app
          echo "Archive created at build/ios/iphoneos/Runner.zip"

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: tafseer-id-release-ios
          path: build/ios/iphoneos/Runner.zip
          retention-days: 30
