name: Deploy Static Web to Cloudflare Pages (tafseer.id)

on:
  push:
    branches:
      - full-web
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.TAFSEER_ID_API_TOKEN }}
          accountId: ${{ secrets.TAFSEER_ID_ACCOUNT_ID }}
          command: pages deploy . --project-name=tafseer-id --branch=full-web
